name: Build Docker images

# Manual escape hatch. Releases publish their image from make-release.yml;
# this rebuilds one from the binaries a published release already carries,
# for instance after a base image fix, without cutting a new release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose binaries go into the image (0.8.0 or later)
        required: true
      latest:
        description: Also move the :latest tag to this image
        type: boolean
        default: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --dir artifacts \
            --pattern unimap-linux.zip --pattern unimap-aarch64-musl.zip
          unzip -q artifacts/unimap-linux.zip        -d artifacts/amd64
          unzip -q artifacts/unimap-aarch64-musl.zip -d artifacts/arm64
          install -D -m 755 artifacts/amd64/unimap docker/bin/amd64/unimap
          install -D -m 755 artifacts/arm64/unimap docker/bin/arm64/unimap

      - name: Decide the tags
        id: tags
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          tags="${USER}/unimap:${{ inputs.tag }}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            tags="${tags},${USER}/unimap:latest"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
