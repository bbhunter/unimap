name: Create and upload artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unimap-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: unimap-linux-i386
            os: ubuntu-latest
            target: i686-unknown-linux-musl
          - name: unimap-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - name: unimap-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: unimap-osx
            os: macos-latest
            target: x86_64-apple-darwin
          - name: unimap-osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: unimap-windows.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: unimap-windows-i686.exe
            os: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked
          strip: true

      - name: Package
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/unimap.exe" "dist/$NAME"
          else
            cp "target/$TARGET/release/unimap" "dist/$NAME"
          fi
          cd dist
          if command -v sha512sum >/dev/null; then
            sha512sum "$NAME" > "$NAME.sha512"
          else
            shasum -a 512 "$NAME" > "$NAME.sha512"
          fi
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            zip -q "$NAME.zip" "$NAME"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.zip
            dist/${{ matrix.name }}.sha512
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.name }}.zip
            dist/${{ matrix.name }}.sha512
