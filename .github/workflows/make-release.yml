name: Create release artifacts

on:
  push:
    tags:
      # Stable tags such as 0.8.0, and pre-releases such as 0.8.0-beta.1.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

env:
  # Pinned so a new cross release cannot change how a tag builds.
  CROSS_VERSION: v0.2.5

jobs:
  build-nix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        type: [ubuntu-x64, ubuntu-x86, armv7, aarch64, aarch64-musl]
        include:
          - type: ubuntu-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: unimap-linux
            path: target/x86_64-unknown-linux-musl/release/unimap
          - type: ubuntu-x86
            os: ubuntu-latest
            target: i686-unknown-linux-musl
            name: unimap-linux-i386
            path: target/i686-unknown-linux-musl/release/unimap
          - type: armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            name: unimap-armv7
            path: target/armv7-unknown-linux-gnueabihf/release/unimap
          - type: aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: unimap-aarch64
            path: target/aarch64-unknown-linux-gnu/release/unimap
          # Static, for the arm64 Docker image and for Alpine or Termux hosts;
          # the glibc build above stays for everything else.
          - type: aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: unimap-aarch64-musl
            path: target/aarch64-unknown-linux-musl/release/unimap
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross builds inside a container that already carries the linker for
      # each target, so nothing has to be installed here.
      - name: Install cross
        run: |
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin cross
          cross --version

      # No strip step: [profile.release] already sets strip = true, so the
      # linker drops the symbols for every target.
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  build-macos:
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: unimap-osx-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/unimap
          if-no-files-found: error

  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        type: [windows-x64, windows-x86]
        include:
          - type: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            name: unimap-windows
            path: target\x86_64-pc-windows-msvc\release\unimap.exe
          - type: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            name: unimap-windows-i686
            path: target\i686-pc-windows-msvc\release\unimap.exe
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Attach the binaries to the release
    needs: [build-nix, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # One zip per artifact holding a single unimap (or unimap.exe) at the
      # root, and a sha512 next to each zip.
      - name: Zip each binary
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -q -r "../${name}.zip" .)
            sha512sum "${name}.zip" > "${name}.zip.sha512"
          done
          ls -l ./*.zip ./*.sha512

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # A tag such as 0.8.0-beta.1 is a pre-release; 0.8.0 is not.
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            body="--notes-file $notes"
          else
            echo "::warning::$notes is missing, falling back to generated notes"
            body="--generate-notes"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip artifacts/*.sha512 --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$tag" artifacts/*.zip artifacts/*.sha512 \
              --title "Unimap v$tag" \
              $body $prerelease
          fi

  docker:
    name: Publish the Docker Hub image
    needs: [release]
    # A release published with GITHUB_TOKEN does not raise the `release` event,
    # so the image has to be built from here rather than from a workflow
    # listening for it. Only for stable tags: a beta must not move :latest.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The same static binaries that went into the release assets, placed
      # where the Dockerfile picks them up by TARGETARCH.
      - name: Stage the binaries
        run: |
          install -D -m 755 artifacts/unimap-linux/unimap        docker/bin/amd64/unimap
          install -D -m 755 artifacts/unimap-aarch64-musl/unimap docker/bin/arm64/unimap
          ls -l docker/bin/*/unimap

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # The Dockerfile installs nmap with apk, which runs under QEMU for arm64.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/unimap:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/unimap:${{ github.ref_name }}
